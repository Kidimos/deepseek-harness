# dsh-toolbox bundle patch: inserts the dual-face plugin row into a web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile <profile> add link:<repo>/plugins/dsh-toolbox`.
#
# The row is a bare plugin by package name: the node half (exports ".") is a
# no-op, and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/ui-toolbox/client.js) load in
# the web GUI. No harness source changes: the column is appended to the
# shipped frame grid at runtime.
- insert:
    - id: ui-toolbox
      name: '@dsh-external/dsh-client-ui-toolbox'
